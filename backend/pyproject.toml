[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
# E/F: errors and bugs · I: import order · B: common bug patterns · UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) in default arguments is the intended pattern.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# Our migrations folder is named "alembic", so tell ruff the alembic *package* is third-party.
known-third-party = ["alembic"]
